<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agri-Genius — AI-powered agricultural chatbot providing expert farming advice on crops, soil, pests, irrigation, and modern agriculture.">
    <title>Agri-Genius — AI Agricultural Advisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── CSS Reset & Variables ──────────────────────────────────── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0f0d;
            --bg-secondary: #111916;
            --bg-tertiary: #19241e;
            --bg-glass: rgba(20, 35, 27, 0.65);
            --bg-glass-border: rgba(52, 211, 153, 0.12);
            --surface-user: linear-gradient(135deg, #059669, #047857);
            --surface-bot: rgba(25, 36, 30, 0.85);
            --text-primary: #ecfdf5;
            --text-secondary: #a7c4b5;
            --text-muted: #6b8f7e;
            --accent: #34d399;
            --accent-glow: rgba(52, 211, 153, 0.25);
            --accent-hover: #6ee7b7;
            --danger: #f87171;
            --border-radius: 16px;
            --border-radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 30px rgba(52, 211, 153, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── Animated Background ───────────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(5, 150, 105, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(52, 211, 153, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(4, 120, 87, 0.06) 0%, transparent 50%);
            animation: bgPulse 12s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgPulse {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(8deg) scale(1.05); }
        }

        /* ── Chat Container (Glassmorphism) ────────────────────────── */
        .chat-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            height: 94vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--bg-glass-border);
            border-radius: 24px;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            overflow: hidden;
        }

        /* ── Header ────────────────────────────────────────────────── */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 28px;
            border-bottom: 1px solid var(--bg-glass-border);
            background: rgba(10, 15, 13, 0.5);
            flex-shrink: 0;
        }

        .header-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, #059669, #34d399);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(52, 211, 153, 0.25);
            flex-shrink: 0;
        }

        .header-info h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-info p {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            animation: pulse 2.5s ease-in-out infinite;
            margin-left: auto;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* ── Chat Messages Area ────────────────────────────────────── */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        /* ── Message Bubbles ───────────────────────────────────────── */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: slideIn 0.35s var(--transition) both;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #059669, #34d399);
            box-shadow: 0 2px 10px rgba(52, 211, 153, 0.2);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.2);
        }

        .message-content {
            padding: 14px 18px;
            border-radius: var(--border-radius);
            line-height: 1.65;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .message.bot .message-content {
            background: var(--surface-bot);
            border: 1px solid var(--bg-glass-border);
            border-top-left-radius: 4px;
            color: var(--text-primary);
        }

        .message.user .message-content {
            background: var(--surface-user);
            border-top-right-radius: 4px;
            color: #ffffff;
        }

        /* ── Bot message rich formatting ───────────────────────────── */
        .message.bot .message-content strong,
        .message.bot .message-content b {
            color: var(--accent);
            font-weight: 600;
        }

        .message.bot .message-content ul,
        .message.bot .message-content ol {
            padding-left: 18px;
            margin: 8px 0;
        }

        .message.bot .message-content li {
            margin-bottom: 4px;
        }

        .message.bot .message-content code {
            background: rgba(52, 211, 153, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            color: var(--accent);
        }

        .message.bot .message-content p {
            margin-bottom: 8px;
        }

        .message.bot .message-content p:last-child {
            margin-bottom: 0;
        }

        /* ── Typing Indicator ──────────────────────────────────────── */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            gap: 12px;
            max-width: 85%;
            animation: slideIn 0.35s var(--transition) both;
        }

        .typing-indicator.visible {
            display: flex;
        }

        .typing-dots {
            padding: 16px 22px;
            background: var(--surface-bot);
            border: 1px solid var(--bg-glass-border);
            border-radius: var(--border-radius);
            border-top-left-radius: 4px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* ── Welcome State ─────────────────────────────────────────── */
        .welcome-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 32px;
            gap: 16px;
        }

        .welcome-icon {
            font-size: 52px;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .welcome-state h2 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-state p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            max-width: 420px;
            line-height: 1.6;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .suggestion-chip {
            padding: 10px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--bg-glass-border);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
        }

        .suggestion-chip:hover {
            background: rgba(52, 211, 153, 0.1);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(52, 211, 153, 0.15);
        }

        /* ── Input Area ────────────────────────────────────────────── */
        .chat-input-area {
            padding: 18px 28px 22px;
            border-top: 1px solid var(--bg-glass-border);
            background: rgba(10, 15, 13, 0.5);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper textarea {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--bg-glass-border);
            border-radius: var(--border-radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            min-height: 48px;
            max-height: 140px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .input-wrapper textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, #059669, #34d399);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(52, 211, 153, 0.25);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 24px rgba(52, 211, 153, 0.35);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.97);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── Error Toast ───────────────────────────────────────────── */
        .error-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--danger);
            padding: 12px 24px;
            border-radius: var(--border-radius-sm);
            font-size: 0.85rem;
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 100;
        }

        .error-toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* ── Responsive ────────────────────────────────────────────── */
        @media (max-width: 860px) {
            .chat-container {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }

        @media (max-width: 480px) {
            .chat-header { padding: 16px 18px; }
            .chat-messages { padding: 16px 14px; }
            .chat-input-area { padding: 14px 14px 18px; }
            .message { max-width: 92%; }
            .suggestions { flex-direction: column; align-items: center; }
            .header-info h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-icon">🌾</div>
            <div class="header-info">
                <h1>Agri-Genius</h1>
                <p>AI-Powered Agricultural Advisor</p>
            </div>
            <div class="status-dot" title="Online"></div>
        </header>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <!-- Welcome State (shown when no messages) -->
            <div class="welcome-state" id="welcomeState">
                <div class="welcome-icon">🌱</div>
                <h2>Welcome to Agri-Genius</h2>
                <p>I'm your AI agricultural advisor. Ask me about crops, soil management, pest control, irrigation, organic farming, or any farming topic.</p>
                <div class="suggestions">
                    <button class="suggestion-chip" onclick="useSuggestion(this)">What crops grow best in clay soil?</button>
                    <button class="suggestion-chip" onclick="useSuggestion(this)">How to manage fall armyworm in maize?</button>
                    <button class="suggestion-chip" onclick="useSuggestion(this)">Best organic fertilizers for rice</button>
                    <button class="suggestion-chip" onclick="useSuggestion(this)">Drip irrigation benefits and subsidies</button>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="message-avatar" style="background: linear-gradient(135deg, #059669, #34d399); box-shadow: 0 2px 10px rgba(52,211,153,0.2);">🌾</div>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea
                    id="messageInput"
                    placeholder="Ask about crops, soil, pests, irrigation..."
                    rows="1"
                    autofocus
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send message">
                    ▶
                </button>
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div class="error-toast" id="errorToast"></div>

    <script>
        // ── DOM References ────────────────────────────────────────────
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeState = document.getElementById('welcomeState');
        const errorToast = document.getElementById('errorToast');

        let isProcessing = false;

        // ── Auto-resize textarea ──────────────────────────────────────
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
        });

        // ── Enter to send (Shift+Enter for new line) ──────────────────
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ── Use suggestion chip ───────────────────────────────────────
        function useSuggestion(btn) {
            messageInput.value = btn.textContent;
            sendMessage();
        }

        // ── Show error toast ──────────────────────────────────────────
        function showError(message) {
            errorToast.textContent = message;
            errorToast.classList.add('visible');
            setTimeout(() => errorToast.classList.remove('visible'), 4000);
        }

        // ── Format bot response (basic markdown-like) ─────────────────
        function formatResponse(text) {
            // Escape HTML
            let formatted = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Bold: **text** or __text__
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/__(.*?)__/g, '<strong>$1</strong>');

            // Inline code: `code`
            formatted = formatted.replace(/`(.*?)`/g, '<code>$1</code>');

            // Unordered lists: - item or * item
            formatted = formatted.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');

            // Ordered lists: 1. item
            formatted = formatted.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');

            // Wrap consecutive <li> in <ul>
            formatted = formatted.replace(/((?:<li>.*?<\/li>\n?)+)/g, '<ul>$1</ul>');

            // Paragraphs: double newlines
            formatted = formatted
                .split(/\n\n+/)
                .map(p => p.trim())
                .filter(p => p)
                .map(p => {
                    if (p.startsWith('<ul>') || p.startsWith('<ol>')) return p;
                    return `<p>${p}</p>`;
                })
                .join('');

            // Single newlines within paragraphs → <br>
            formatted = formatted.replace(/(?<!<\/li>)\n(?!<)/g, '<br>');

            return formatted;
        }

        // ── Append message to chat ────────────────────────────────────
        function appendMessage(role, content) {
            // Hide welcome state on first message
            if (welcomeState) {
                welcomeState.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', role);

            const avatar = document.createElement('div');
            avatar.classList.add('message-avatar');
            avatar.textContent = role === 'bot' ? '🌾' : '👤';

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');

            if (role === 'bot') {
                contentDiv.innerHTML = formatResponse(content);
            } else {
                contentDiv.textContent = content;
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ── Send message ──────────────────────────────────────────────
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Show user message
            appendMessage('user', message);

            // Show typing indicator
            typingIndicator.classList.add('visible');
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });

                const data = await response.json();

                // Hide typing indicator
                typingIndicator.classList.remove('visible');

                if (response.ok && data.response) {
                    appendMessage('bot', data.response);
                } else {
                    const errorMsg = data.error || 'Something went wrong. Please try again.';
                    showError(errorMsg);
                    appendMessage('bot', '&#9888;&#65039; ' + errorMsg);
                }
            } catch (err) {
                typingIndicator.classList.remove('visible');
                showError('Network error. Is the server running?');
                appendMessage('bot', '⚠️ Unable to reach the server. Please check your connection.');
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }
    </script>
</body>
</html>
